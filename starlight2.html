<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Starlight 2 — Звёздный английский</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap');
:root{--bg:#FFFAF3;--card:#fff;--text:#2A2530;--text2:#7A7384;--sh:0 2px 12px rgba(40,35,50,.07);--shl:0 8px 28px rgba(40,35,50,.11);--r:18px;--rs:12px;--ok:#2D8B57;--no:#D04040;--gold:#EFA520}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}.app{max-width:500px;margin:0 auto;min-height:100vh;padding-bottom:40px}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes si{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}.fu{animation:fu .35s ease-out both}.si{animation:si .3s ease-out both}
.hdr{padding:28px 22px 10px;text-align:center}.hdr h1{font-size:26px;font-weight:900}.hdr .sub{font-family:'Literata',serif;font-size:14px;color:var(--text2);margin-top:2px}
.mlist{padding:6px 18px 20px}.mc{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;margin-bottom:14px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}.mc:hover{transform:translateY(-2px);box-shadow:var(--shl)}.mc:active{transform:scale(.98)}.mc-bar{position:absolute;top:0;left:0;right:0;height:4px}.mc-num{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;color:#fff;font-weight:800;font-size:15px;margin-bottom:8px}.mc-t{font-size:17px;font-weight:800}.mc-tr{font-family:'Literata',serif;font-size:13px;color:var(--text2)}.mc-info{margin-top:8px;font-size:12px;color:var(--text2);font-weight:600}
.ph{display:flex;align-items:center;gap:12px;padding:18px 18px 10px}.bb{width:38px;height:38px;border-radius:11px;background:var(--card);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh);color:var(--text);transition:all .12s;flex-shrink:0}.bb:hover{background:#f0ebe3}.pt{font-size:18px;font-weight:800}.ps{font-family:'Literata',serif;font-size:12px;color:var(--text2)}
.llist{padding:6px 18px 20px}.lc{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:space-between}.lc:hover{transform:translateY(-1px);box-shadow:var(--shl)}.lc h3{font-size:15px;font-weight:700}.lc p{font-family:'Literata',serif;font-size:12px;color:var(--text2)}
.tabs{display:flex;gap:5px;padding:2px 18px;margin-bottom:6px}.tab{flex:1;padding:9px 6px;border-radius:var(--rs);border:none;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--card);color:var(--text2);box-shadow:var(--sh)}.tab.on{color:#fff;box-shadow:var(--shl)}
.cnt{padding:10px 18px 24px}
.pc{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:12px}.pc-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}.pc-l{font-size:28px;font-weight:900;padding:4px 14px;border-radius:9px}.pc-eq{font-size:20px;color:#ccc}.pc-rus{font-size:20px;font-weight:800}.pc-ipa{font-family:'Literata',serif;color:var(--text2);font-size:14px;margin-left:2px}.pc-r{font-size:13.5px;line-height:1.5;padding:9px 13px;background:var(--bg);border-radius:var(--rs);margin-bottom:10px}.pc-ex{display:flex;gap:7px;flex-wrap:wrap}.pc-ex span{padding:5px 12px;border-radius:7px;font-weight:700;font-size:14px}
.wc{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 18px;margin-bottom:9px}.wc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.wc-en{font-size:20px;font-weight:800;display:flex;align-items:baseline;gap:2px;flex-wrap:wrap}.wc-en .hi{padding:1px 3px;border-radius:4px}.wc-ts{font-family:'Literata',serif;font-size:13px;color:var(--text2);padding:3px 10px;background:var(--bg);border-radius:6px;display:flex;gap:6px;align-items:center}.wc-ts .ru{font-weight:600;color:var(--text)}.wc-ts .sep{color:#ccc;font-size:10px}.wc-ts .ipa{color:var(--text2)}.wc-ru{font-family:'Literata',serif;font-size:14px;color:var(--text2);margin:3px 0 7px}.wc-bd{display:flex;align-items:center;gap:1px;font-size:13px;padding:7px 11px;background:var(--bg);border-radius:var(--rs);flex-wrap:wrap}.wb{display:inline-flex;align-items:center;gap:2px;padding:2px 5px;border-radius:4px;margin:1px}.wb.hi{background:rgba(0,0,0,.05)}.wb-l{font-weight:700}.wb-a{color:var(--text2);font-size:10px;margin:0 1px}.wb-s{font-family:'Literata',serif;color:var(--text2)}
.prh{text-align:center;margin-bottom:14px}.prd{display:flex;gap:3px;justify-content:center;margin-bottom:8px;flex-wrap:wrap;max-width:340px;margin-left:auto;margin-right:auto}.dot{width:8px;height:8px;border-radius:50%;background:#e0dbd3;transition:all .25s}.dot.ok{background:var(--ok)}.dot.no{background:var(--no)}.dot.cur{background:var(--gold);transform:scale(1.35)}.prc{font-size:12px;color:var(--text2);font-weight:600}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.qc{background:var(--card);border-radius:var(--r);box-shadow:var(--shl);padding:24px 20px;text-align:center;margin-bottom:14px}.qw{font-size:28px;font-weight:900;margin-bottom:2px;word-break:break-word}.qipa{font-family:'Literata',serif;font-size:13px;color:var(--text2);margin-bottom:2px}.qh{font-family:'Literata',serif;font-size:13px;color:var(--text2);margin-bottom:16px}.qo{display:flex;flex-direction:column;gap:7px}.qob{padding:13px 18px;border-radius:var(--rs);border:2px solid #e8e3db;background:var(--card);font-family:'Nunito',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;text-align:left}.qob:hover:not(:disabled){border-color:#ccc;background:var(--bg)}.qob.ok{border-color:var(--ok);background:#e8f5e9;color:var(--ok)}.qob.no{border-color:var(--no);background:#fde8e8;color:var(--no)}.qob:disabled{cursor:default}
.qfb{margin-top:14px;padding:10px 14px;border-radius:var(--rs);font-weight:700;font-size:14px;animation:pop .3s ease-out;display:flex;align-items:center;justify-content:center;gap:7px}.qfb.ok{background:#e8f5e9;color:var(--ok)}.qfb.no{background:#fde8e8;color:var(--no)}
.nb{margin-top:14px;padding:12px 28px;border-radius:var(--rs);border:none;color:#fff;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .12s;display:inline-flex;align-items:center;gap:6px}.nb:hover{opacity:.9;transform:translateY(-1px)}
.res{text-align:center;padding:36px 20px}.res-sc{font-size:44px;font-weight:900;margin-bottom:2px}.res h2{font-size:22px;font-weight:900;margin-bottom:4px}.res p{font-family:'Literata',serif;font-size:14px;color:var(--text2);margin-bottom:22px}
.rb{padding:11px 22px;border-radius:var(--rs);border:2px solid var(--text);background:var(--text);color:#fff;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .12s;display:inline-flex;align-items:center;gap:5px}.rb:hover{opacity:.9}
.gram-btn{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:var(--r);padding:18px 20px;margin:0 18px 14px;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:12px;width:calc(100% - 36px);box-shadow:var(--sh);text-align:left}.gram-btn:hover{transform:translateY(-2px);box-shadow:var(--shl)}.gram-btn:active{transform:scale(.98)}.gram-btn .gb-icon{font-size:28px;flex-shrink:0}.gram-btn .gb-t{font-size:16px;font-weight:800}.gram-btn .gb-s{font-size:12px;opacity:.85;font-family:'Literata',serif}
.gl{padding:6px 18px 20px}.gc{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:all .18s;border-left:4px solid}.gc:hover{transform:translateY(-1px);box-shadow:var(--shl)}.gc h3{font-size:15px;font-weight:800}.gc p{font-family:'Literata',serif;font-size:12px;color:var(--text2)}
.gr-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}.gr-rule{font-size:15px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}.gr-rule::before{content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0}.gr-exs{display:flex;flex-wrap:wrap;gap:6px;padding-left:14px}.gr-ex{padding:5px 12px;border-radius:8px;font-size:14px;font-weight:600;font-family:'Nunito',sans-serif}
.sep-line{height:1px;background:#e8e3db;margin:8px 18px 16px}
.part-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text2);padding:12px 22px 4px}
.theory-box{background:linear-gradient(135deg,#f8f4ff,#fff8f0);border-left:4px solid;padding:14px 16px;border-radius:0 var(--rs) var(--rs) 0;margin-bottom:14px;font-size:14px;line-height:1.65}
.theory-box h4{font-size:15px;font-weight:800;margin-bottom:4px}
.theory-box p{color:var(--text);margin-bottom:8px}
.theory-box .tex{padding:5px 12px;border-radius:8px;font-weight:600;font-size:13.5px;display:block;margin:3px 0;background:rgba(0,0,0,.03);line-height:1.6}
.gram-tabs{display:flex;gap:5px;padding:2px 18px;margin-bottom:6px}
.gram-tab{flex:1;padding:9px 6px;border-radius:var(--rs);border:none;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;cursor:pointer;transition:all .18s;background:var(--card);color:var(--text2);box-shadow:var(--sh);text-align:center;display:flex;align-items:center;justify-content:center;gap:5px}
.gram-tab.on{color:#fff;box-shadow:var(--shl)}
.gram-tab svg{width:14px;height:14px;flex-shrink:0}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>

          { letters: "e", rus: "э", ipa: "/e/", rule: "Буква E в закрытом слоге читается как «э».", examples: ["egg", "bed", "pen"] },

          { letters: "i", rus: "и", ipa: "/ɪ/", rule: "Буква I в закрытом слоге читается как «и».", examples: ["is", "it", "big"] },
          { letters: "j", rus: "дж", ipa: "/dʒ/", rule: "Буква J читается как «дж».", examples: ["jump", "jam", "jeans"] },

          { en: "cat", ru: "кошка", ts: "кэт", ipa: "/kæt/", breakdown: [{ t: "c", s: "к" }, { t: "a", s: "э", hi: true }, { t: "t", s: "т" }] },
          { en: "dog", ru: "собака", ts: "дог", ipa: "/dɒɡ/", breakdown: [{ t: "d", s: "д" }, { t: "o", s: "о", hi: true }, { t: "g", s: "г" }] },

  {

function sh(a) { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = 0 | Math.random() * (i + 1); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function pick(arr, exc, n) { return sh(arr.filter(x => x !== exc)).slice(0, n); }

function buildQs(lesson, allPh) {
  const ws = lesson.words, phs = lesson.phonics, qs = [];
  sh(ws).forEach(w => { const o = sh([w.ru, ...pick(ws.map(x => x.ru), w.ru, 3)]).slice(0, 4); qs.push({ prompt: w.en, sub: "Как переводится?", answer: w.ru, options: o, tag: "перевод" }); });
  sh(ws).forEach(w => { const o = sh([w.en, ...pick(ws.map(x => x.en), w.en, 3)]).slice(0, 4); qs.push({ prompt: w.ru, sub: "Выбери английское слово", answer: w.en, options: o, tag: "перевод" }); });
  sh(ws).filter(w => w.ts).forEach(w => { const ot = ws.filter(x => x.ts && x.en !== w.en).map(x => x.ts); if (ot.length < 2) return; const o = sh([w.ts, ...pick(ot, w.ts, 3)]).slice(0, 4); qs.push({ prompt: w.en, sub: "Как читается?", answer: w.ts, options: o, tag: "чтение" }); });
  sh(ws).filter(w => w.ts).slice(0, 5).forEach(w => { const ot = ws.filter(x => x.ts && x.en !== w.en).map(x => x.en); if (ot.length < 2) return; const o = sh([w.en, ...pick(ot, w.en, 3)]).slice(0, 4); qs.push({ prompt: w.ts, sub: "Какое слово так читается?", answer: w.en, options: o, tag: "чтение" }); });
  sh(ws).filter(w => w.ipa && w.ts).forEach(w => { const ot = ws.filter(x => x.ts && x.en !== w.en).map(x => x.ts); if (ot.length < 2) return; const o = sh([w.ts, ...pick(ot, w.ts, 3)]).slice(0, 4); qs.push({ prompt: w.ipa, sub: "Как это читается по-русски?", answer: w.ts, options: o, tag: "чтение" }); });
  phs.forEach(p => { const all = [...new Set([...phs.map(x => x.rus), ...(allPh || []).map(x => x.rus)])]; const ot = all.filter(x => x !== p.rus); if (ot.length < 2) return; const o = sh([p.rus, ...pick(ot, p.rus, 3)]).slice(0, 4); qs.push({ prompt: p.letters, sub: "Какой звук дают эти буквы?", answer: p.rus, options: o, tag: "звук", ipa: p.ipa }); });
  phs.forEach(p => { const yes = ws.filter(w => w.breakdown.some(b => b.hi && b.s.includes(p.rus.split(" ")[0]))); const no = ws.filter(w => !yes.includes(w)); if (!yes.length || no.length < 2) return; const c = sh(yes)[0]; const o = sh([c.en, ...pick(no.map(x => x.en), c.en, 3)]).slice(0, 4); qs.push({ prompt: p.letters + " = " + p.rus, sub: "В каком слове есть этот звук?", answer: c.en, options: o, tag: "звук" }); });
  return sh(qs);
}

  '</div><div class="sep-line"></div><div class="part-label">Часть 2 · Модули 5–8</div><div class="mlist">'+p2.map((m,i)=>mC(m,i+p1.length)).join("")+'</div></div>';
}
function mC(m,i){const w=m.lessons.reduce((s,l)=>s+l.words.length,0);return'<div class="mc fu" style="animation-delay:'+i*.05+'s" onclick="goMod('+m.id+')"><div class="mc-bar" style="background:'+m.color+'"></div><div class="mc-num" style="background:'+m.color+'">'+m.id+'</div><div class="mc-t">'+e(m.title)+'</div><div class="mc-tr">'+e(m.titleRu)+'</div><div class="mc-info">'+m.lessons.length+' уроков · '+w+' слов</div></div>';}
function renderM(mod){app.innerHTML='<div class="fu"><div class="ph"><button class="bb" onclick="go(\'home\')">←</button><div><div class="pt" style="color:'+mod.color+'">Модуль '+mod.id+': '+e(mod.title)+'</div><div class="ps">'+e(mod.titleRu)+'</div></div></div><div class="llist">'+mod.lessons.map((l,i)=>'<div class="lc fu" style="animation-delay:'+i*.06+'s" onclick="goLes(\''+l.id+'\')"><div><h3>'+e(l.title)+'</h3><p>'+e(l.titleRu)+' · '+l.words.length+' слов</p></div><span style="color:'+mod.color+';font-weight:700;font-size:18px">→</span></div>').join("")+'</div></div>';}
function renderL(mod,les){const tabs=[{k:"ph",l:"Звуки"},{k:"wo",l:"Слова"},{k:"pr",l:"Тренировка"}];app.innerHTML='<div class="fu"><div class="ph"><button class="bb" onclick="go(\'mod\')">←</button><div><div class="pt">'+e(les.title)+'</div><div class="ps">'+e(les.titleRu)+'</div></div></div><div class="tabs">'+tabs.map(t=>'<button class="tab'+(state.tab===t.k?' on':'')+'" style="'+(state.tab===t.k?'background:'+mod.color:'')+'" onclick="sT(\''+t.k+'\')">'+t.l+'</button>').join("")+'</div><div id="tc"></div></div>';rT(mod,les);}
function rT(mod,les){const tc=$("tc");if(!tc)return;if(state.tab==="ph")tc.innerHTML=rPh(les,mod.color);else if(state.tab==="wo")tc.innerHTML=rWo(les,mod.color);else{iPr(les,mod);rPr(mod.color);}}
function rPh(les,c){return'<div class="cnt">'+les.phonics.map((p,i)=>'<div class="pc fu" style="animation-delay:'+i*.07+'s"><div class="pc-top"><div class="pc-l" style="background:'+c+'15;color:'+c+'">'+e(p.letters)+'</div><span class="pc-eq">=</span><span class="pc-rus" style="color:'+c+'">'+e(p.rus)+'</span><span class="pc-ipa">'+e(p.ipa)+'</span></div><div class="pc-r">'+e(p.rule)+'</div><div class="pc-ex">'+p.examples.map(x=>'<span style="background:'+c+'12;color:'+c+'">'+e(x)+'</span>').join("")+'</div></div>').join("")+'</div>';}
function rWo(les,c){return'<div class="cnt">'+les.words.map((w,i)=>'<div class="wc fu" style="animation-delay:'+i*.04+'s"><div class="wc-top"><div class="wc-en">'+w.breakdown.map(b=>'<span class="'+(b.hi?"hi":"")+'" style="'+(b.hi?'background:'+c+'18;color:'+c:'')+'">'+e(b.t)+'</span>').join("")+'</div>'+(w.ts?'<div class="wc-ts"><span class="ru">'+e(w.ts)+'</span>'+(w.ipa?'<span class="sep">|</span><span class="ipa">'+e(w.ipa)+'</span>':'')+'</div>':'')+'</div><div class="wc-ru">'+e(w.ru)+'</div><div class="wc-bd">'+w.breakdown.map(b=>'<span class="wb'+(b.hi?" hi":"")+'"><span class="wb-l" style="'+(b.hi?'color:'+c:'')+'">'+e(b.t)+'</span><span class="wb-a">→</span><span class="wb-s">'+e(b.s)+'</span></span>').join("")+'</div></div>').join("")+'</div>';}
function iPr(les,mod){if(practiceState&&practiceState.lid===les.id)return;practiceState={lid:les.id,qs:buildQs(les,mod.lessons.flatMap(l=>l.phonics)),cur:0,sel:null,res:[],done:false};}
function rPr(c){const tc=$("tc");if(!tc||!practiceState)return;const ps=practiceState,tC={перевод:{bg:"#EDE7F6",c:"#5E35B1"},чтение:{bg:"#E0F2F1",c:"#00695C"},звук:{bg:"#FFF3E0",c:"#E65100"}};if(ps.done){const s=ps.res.filter(Boolean).length,t=ps.qs.length,p=t>0?s/t:0,st=p>=.95?3:p>=.7?2:p>=.4?1:0;tc.innerHTML='<div class="cnt"><div class="res"><div style="font-size:40px;margin-bottom:8px">'+[0,1,2].map(i=>'<span style="color:'+(i<st?'var(--gold)':'#e0dbd3')+';margin:0 3px">★</span>').join("")+'</div><div class="res-sc" style="color:'+c+'">'+s+'/'+t+'</div><h2>'+(st===3?"Блестяще!":st>=2?"Молодец!":"Ещё разок!")+'</h2><button class="rb" onclick="rPrR()">↻ Ещё раз</button></div></div>';return;}if(!ps.qs.length)return;const q=ps.qs[ps.cur],tot=ps.qs.length,tg=tC[q.tag]||tC["перевод"];tc.innerHTML='<div class="cnt"><div class="prh"><div class="prd">'+ps.qs.map((_,i)=>'<div class="dot'+(i<ps.cur?(ps.res[i]?" ok":" no"):i===ps.cur?" cur":"")+'"></div>').join("")+'</div><div class="prc">'+(ps.cur+1)+'/'+tot+'</div></div><div class="qc si"><div class="tag" style="background:'+tg.bg+';color:'+tg.c+'">'+e(q.tag)+'</div><div class="qw" style="color:'+c+'">'+e(q.prompt)+'</div>'+(q.ipa?'<div class="qipa">'+e(q.ipa)+'</div>':'')+'<div class="qh">'+e(q.sub)+'</div><div class="qo">'+q.options.map((o,i)=>'<button class="qob'+(ps.sel!==null?(o===q.answer?" ok":o===ps.sel?" no":""):"")+'" onclick="pAns('+i+')" '+(ps.sel!==null?'disabled':'')+'>'+e(o)+'</button>').join("")+'</div>'+(ps.sel!==null?'<div class="qfb'+(ps.sel===q.answer?" ok":" no")+'">'+(ps.sel===q.answer?"✓ Правильно!":"✗ Ответ: "+e(q.answer))+'</div><button class="nb" style="background:'+c+'" onclick="pNxt()">'+(ps.cur+1>=tot?"Результат":"Дальше")+' →</button>':'')+'</div></div>';}

// GRAMMAR
function renderGL(){app.innerHTML='<div class="fu"><div class="ph"><button class="bb" onclick="go(\'home\')">←</button><div><div class="pt" style="color:#6366f1">Грамматика</div><div class="ps">Grammar Reference</div></div></div><div class="gl">'+GRAMMAR.map((g,i)=>'<div class="gc fu" style="animation-delay:'+i*.06+'s;border-left-color:'+g.color+'" onclick="goGram(\''+g.id+'\')"><h3 style="color:'+g.color+'">'+e(g.title)+'</h3><p>'+e(g.titleEn)+'</p></div>').join("")+'</div></div>';}
function renderGD(t){const gt=state.gramTab||"theory";app.innerHTML='<div class="fu"><div class="ph"><button class="bb" onclick="go(\'gram\')">←</button><div><div class="pt" style="color:'+t.color+'">'+e(t.title)+'</div><div class="ps">'+e(t.titleEn)+'</div></div></div><div class="gram-tabs"><button class="gram-tab'+(gt==="theory"?" on":"")+'" style="'+(gt==="theory"?"background:"+t.color:"")+'" onclick="sGT(\'theory\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Теория</button><button class="gram-tab'+(gt==="examples"?" on":"")+'" style="'+(gt==="examples"?"background:"+t.color:"")+'" onclick="sGT(\'examples\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Примеры</button><button class="gram-tab'+(gt==="quiz"?" on":"")+'" style="'+(gt==="quiz"?"background:"+t.color:"")+'" onclick="sGT(\'quiz\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Тест</button></div><div id="gc2"></div></div>';rGT(t);}
function rGT(t){const gc=$("gc2");if(!gc)return;const gt=state.gramTab||"theory",c=t.color;
  if(gt==="theory"){gc.innerHTML='<div class="cnt">'+t.theory.map((s,i)=>{let h='<div class="theory-box fu" style="border-color:'+c+';animation-delay:'+i*.06+'s"><h4 style="color:'+c+'">'+e(s.heading)+'</h4><p>'+e(s.text)+'</p>';if(s.ex)h+=s.ex.map(x=>'<span class="tex">'+e(x)+'</span>').join("");return h+'</div>';}).join("")+'</div>';}
  else if(gt==="examples"){gc.innerHTML='<div class="cnt">'+t.theory.filter(s=>s.ex&&s.ex.length).map((s,i)=>{let h='<div class="gr-card fu" style="animation-delay:'+i*.06+'s"><div class="gr-rule"><span style="background:'+c+';width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0"></span>'+e(s.heading)+'</div>';h+=s.ex.map(x=>'<div style="padding:6px 12px;border-radius:8px;margin-bottom:3px;background:var(--bg);font-size:14px;font-weight:600;color:'+c+'">'+e(x)+'</div>').join("");return h+'</div>';}).join("")+'</div>';}
  else if(gt==="quiz"){if(!t.quiz||!t.quiz.length){gc.innerHTML='<div class="cnt"><p style="text-align:center;color:var(--text2);padding:40px">Скоро</p></div>';return;}if(!gramQuizState||gramQuizState.tid!==t.id){gramQuizState={tid:t.id,qs:sh(t.quiz.map(q=>({...q,options:sh([...q.options])}))  ),cur:0,sel:null,res:[],done:false};}rGQ(c);}
}
function rGQ(c){const gc=$("gc2");if(!gc||!gramQuizState)return;const gs=gramQuizState;if(gs.done){const s=gs.res.filter(Boolean).length,t=gs.qs.length,p=t>0?s/t:0,st=p>=.95?3:p>=.7?2:p>=.4?1:0;gc.innerHTML='<div class="cnt"><div class="res"><div style="font-size:40px;margin-bottom:8px">'+[0,1,2].map(i=>'<span style="color:'+(i<st?'var(--gold)':'#e0dbd3')+';margin:0 3px">★</span>').join("")+'</div><div class="res-sc" style="color:'+c+'">'+s+'/'+t+'</div><h2>'+(st===3?"Блестяще!":st>=2?"Молодец!":"Ещё разок!")+'</h2><button class="rb" onclick="rGR()">↻ Ещё раз</button></div></div>';return;}const q=gs.qs[gs.cur],tot=gs.qs.length;gc.innerHTML='<div class="cnt"><div class="prh"><div class="prd">'+gs.qs.map((_,i)=>'<div class="dot'+(i<gs.cur?(gs.res[i]?" ok":" no"):i===gs.cur?" cur":"")+'"></div>').join("")+'</div><div class="prc">'+(gs.cur+1)+'/'+tot+'</div></div><div class="qc si"><div class="qw" style="color:'+c+';font-size:20px">'+e(q.q)+'</div><div class="qh">Выбери правильный ответ</div><div class="qo">'+q.options.map((o,i)=>'<button class="qob'+(gs.sel!==null?(o===q.answer?" ok":o===gs.sel?" no":""):"")+'" onclick="gAns('+i+')" '+(gs.sel!==null?'disabled':'')+'>'+e(o)+'</button>').join("")+'</div>'+(gs.sel!==null?'<div class="qfb'+(gs.sel===q.answer?" ok":" no")+'">'+(gs.sel===q.answer?"✓ Правильно!":"✗ Ответ: "+e(q.answer))+'</div><button class="nb" style="background:'+c+'" onclick="gNxt()">'+(gs.cur+1>=tot?"Результат":"Дальше")+' →</button>':'')+'</div></div>';}

function go(s){state.scr=s;practiceState=null;gramQuizState=null;render();scrollTo(0,0);}
function goMod(id){state.modId=id;state.scr="mod";render();scrollTo(0,0);}
function goLes(id){state.lesId=id;state.tab="ph";state.scr="les";practiceState=null;render();scrollTo(0,0);}
function goGram(id){state.gramId=id;state.gramTab="theory";state.scr="gram-detail";gramQuizState=null;render();scrollTo(0,0);}
function sT(t){state.tab=t;practiceState=null;render();}
function sGT(t){state.gramTab=t;renderGD(GRAMMAR.find(g=>g.id===state.gramId));}
function pAns(i){if(!practiceState||practiceState.sel!==null)return;const q=practiceState.qs[practiceState.cur];practiceState.sel=q.options[i];practiceState.res.push(q.options[i]===q.answer);rPr(MODULES.find(m=>m.id===state.modId).color);}
function pNxt(){if(!practiceState)return;if(practiceState.cur+1>=practiceState.qs.length)practiceState.done=true;else{practiceState.cur++;practiceState.sel=null;}rPr(MODULES.find(m=>m.id===state.modId).color);}
function rPrR(){const mod=MODULES.find(m=>m.id===state.modId),les=mod.lessons.find(l=>l.id===state.lesId);practiceState=null;iPr(les,mod);rPr(mod.color);}
function gAns(i){if(!gramQuizState||gramQuizState.sel!==null)return;const q=gramQuizState.qs[gramQuizState.cur];gramQuizState.sel=q.options[i];gramQuizState.res.push(q.options[i]===q.answer);rGQ(GRAMMAR.find(g=>g.id===state.gramId).color);}
function gNxt(){if(!gramQuizState)return;if(gramQuizState.cur+1>=gramQuizState.qs.length)gramQuizState.done=true;else{gramQuizState.cur++;gramQuizState.sel=null;}rGQ(GRAMMAR.find(g=>g.id===state.gramId).color);}
function rGR(){gramQuizState=null;rGT(GRAMMAR.find(g=>g.id===state.gramId));}
render();
</script>
</body>
</html>
