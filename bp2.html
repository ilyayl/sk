<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бизнес-процесс СК — интерактивная доска (v2)</title>
<style>
:root{--navy:#1f4e79;--navy2:#2e6ca4;--ink:#1b2733;--muted:#5b6b7b;--bg:#e9eef3;--line:#cdd8e2;--accent:#e8a33d;
--contractor:#c0504d;--sk:#1f7a55;--geo:#7a5fb0;--lead:#1f4e79;--rp:#2e8bc0;--legal:#b2532a;--rso:#6b7b8c;--tz:#3a3f57;}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
header{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.2);position:relative;z-index:5}
header h1{font-size:17px;margin:0;font-weight:700}
header .hint{font-size:12px;opacity:.85}
.legend{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
.lg{font-size:11px;background:rgba(255,255,255,.13);border-radius:14px;padding:3px 9px;display:flex;align-items:center;gap:5px}
.lg b{font-size:13px;line-height:1}
#viewport{position:absolute;inset:0;top:0;cursor:grab;background:
  radial-gradient(circle at 1px 1px, #d4dde6 1px, transparent 0);background-size:26px 26px}
#viewport.grab{cursor:grabbing}
#board{position:absolute;transform-origin:0 0;will-change:transform}
svg.links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.node{position:absolute;border-radius:11px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 6px rgba(31,78,121,.10);padding:9px 12px;font-size:13px;transition:box-shadow .15s,transform .15s}
.node .nh{font-size:10.5px;font-weight:700;color:#fff;border-radius:6px;padding:1px 7px;display:inline-block;margin-bottom:4px}
.node .nt{font-weight:700;font-size:13.5px;line-height:1.25}
.node .ns{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.25}
.node.phase{border-top:4px solid var(--navy);cursor:pointer}
.node.phase:hover{box-shadow:0 8px 20px rgba(31,78,121,.28);transform:translateY(-2px)}
.node.phase .more{position:absolute;right:9px;bottom:7px;font-size:10px;color:var(--navy2);font-weight:700}
.node.dec{background:#fff8ec;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;text-align:center}
.node.dec .nt{font-size:12px;font-weight:700;color:#8a5a12}
.node.term{background:var(--navy);color:#fff;border:none;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700}
.node.term.fin{background:var(--accent);color:#3a2a06}
.node.side{font-size:11.5px}
.side.stop{border-left:5px solid var(--contractor);background:#fdf0ef}
.side.escal{border-left:5px solid var(--legal);background:#fbf0ea}
.side.info{border-left:5px solid var(--rp);background:#eef5fb}
.side.rework{border-left:5px solid var(--accent);background:#fff8ec}
.side.output{border-left:5px solid var(--sk);background:#eef7f2}
.elabel{position:absolute;font-size:10.5px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:9px;padding:0 6px;color:var(--muted);transform:translate(-50%,-50%);white-space:nowrap}
.elabel.y{color:var(--sk);border-color:#bfe0cd}.elabel.n{color:var(--contractor);border-color:#eccac7}
/* controls */
#ctrl{position:absolute;right:16px;bottom:16px;z-index:6;display:flex;flex-direction:column;gap:6px}
#ctrl button{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.12);color:var(--navy)}
#ctrl button:hover{background:var(--navy);color:#fff}
#ctrl button.sm{font-size:11px;font-weight:700}
/* drawer */
#scrim{position:absolute;inset:0;background:rgba(20,30,40,.35);opacity:0;visibility:hidden;transition:.2s;z-index:8}
#scrim.on{opacity:1;visibility:visible}
#drawer{position:absolute;top:0;right:0;height:100%;width:440px;max-width:92vw;background:#fff;box-shadow:-6px 0 24px rgba(0,0,0,.25);transform:translateX(100%);transition:transform .25s;z-index:9;overflow-y:auto}
#drawer.on{transform:none}
.dh{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:16px 18px;position:sticky;top:0}
.dh .num{font-size:12px;opacity:.85}
.dh h2{margin:3px 0 4px;font-size:19px}
.dh .role{display:inline-block;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.2);border-radius:14px;padding:3px 10px}
.dh .x{position:absolute;right:14px;top:14px;cursor:pointer;font-size:22px;line-height:1;opacity:.9}
.dc{padding:16px 18px 40px}
.box{background:#f7fafc;border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:12px}
.box h4{margin:0 0 7px;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--navy2)}
.box.io h4{color:var(--sk)} .box ul{margin:0;padding-left:18px;font-size:13px}.box li{margin:3px 0}
.dec2{background:#fff;border:1px dashed var(--accent);border-radius:9px;padding:11px 13px;margin-bottom:12px}
.dec2 h4{margin:0 0 7px;font-size:11.5px;text-transform:uppercase;color:#a06a13}
.branch{display:flex;gap:9px;align-items:flex-start;font-size:13px;margin:5px 0}
.yn{font-weight:800;border-radius:6px;padding:1px 8px;font-size:11px;flex:0 0 auto;margin-top:1px}
.yn.y{background:#e3f3ea;color:var(--sk)}.yn.n{background:#fbe7e5;color:var(--contractor)}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.pill{font-size:11px;border-radius:13px;padding:3px 9px;border:1px solid var(--line);background:#fff;color:var(--muted)}
.pill.term{background:#fff3e0;border-color:#f0c98a;color:#8a5a12;font-weight:600}
.pill.norm{background:#eef4fb;border-color:#c5d9ef;color:#26537e}
.app{display:inline-block;font-size:10.5px;font-weight:700;background:var(--navy);color:#fff;border-radius:6px;padding:2px 8px;margin:2px 4px 2px 0}
.afn{margin:6px 0 12px;background:#fbfdff;border:1px solid var(--line);border-radius:9px;padding:11px}
.afn h4{margin:0 0 9px;color:var(--navy2);font-size:11px;text-transform:uppercase}
.afn .row{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.stp{background:#fff;border:1px solid var(--line);border-top:3px solid var(--sk);border-radius:7px;padding:5px 8px;font-size:11px;max-width:180px}
.stp.d{border-top-color:var(--accent);background:#fffaf0}.stp.e{border-top-color:var(--contractor)}
.ar{color:var(--navy2);font-weight:800}
</style></head>

<header>

<div id="drawer"><div id="drawerInner"></div></div>

 ['p2','b','d2','t'],['d2','b','p3','t','нет','n'],['d2','r','s2','l','да','y'],
 ['p3','b','p4','t'],['p4','b','d3','t'],
 ['d3','b','dn','t','да','y'],['d3','r','s3','l','нет','n'],
 ['dn','b','p6','t','нет','n'],['dn','r','p5','l','да','y'],
 ['p5','b','du','t'],['du','l','p6','r','устранено','y'],['du','r','s4','l','нет','n'],
 ['p6','b','d4','t'],['p6','l','s6','r','',null,true],
 ['d4','l','s5','r','да','y'],['d4','b','p7','t','нет','n'],
 ['p7','b','p8','t'],['p8','b','p9','t'],['p9','b','res','t']
];
// render legend
document.getElementById('legend').innerHTML=Object.values(ROLES).map(r=>`<span class="lg"><b style="color:${r.c}">●</b>${r.n}</span>`).join('');
const NM={};NODES.forEach(n=>NM[n.id]=n);
const board=document.getElementById('board');
const svg=document.getElementById('links');
// nodes
NODES.forEach(n=>{
 const d=document.createElement('div');
 const role=n.kind==='phase'?ROLES[STAGES[n.s].role]:null;
 d.className='node '+n.kind+(n.kind==='side'?' '+n.tone:'')+(n.fin?' fin':'');
 d.style.left=n.x+'px';d.style.top=n.y+'px';d.style.width=n.w+'px';d.style.minHeight=n.h+'px';
 if(n.kind==='phase'){d.style.borderTopColor=role.c;
   d.innerHTML=`<span class="nh" style="background:${role.c}">Фаза ${n.s}</span><div class="nt">${STAGES[n.s].t}</div><div class="ns">${role.n}</div><span class="more">детали ▸</span>`;
   d.onclick=(e)=>{e.stopPropagation();openDrawer(n.s);};
 } else if(n.kind==='dec'){d.innerHTML=`<div class="nt">◇ ${n.t}</div>`;}
 else if(n.kind==='term'){d.innerHTML=`<div class="nt">${n.t}</div>`;}
 else {d.innerHTML=`<div>${n.t}</div>`;}
 board.appendChild(d);
});
// edges
function anchor(n,a){const cx=n.x+n.w/2,cy=n.y+n.h/2;if(a==='t')return[cx,n.y];if(a==='b')return[cx,n.y+n.h];if(a==='l')return[n.x,cy];return[n.x+n.w,cy];}
const NS='http://www.w3.org/2000/svg';
svg.innerHTML=`<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5b7186"/></marker></defs>`;
let maxX=0,maxY=0;NODES.forEach(n=>{maxX=Math.max(maxX,n.x+n.w);maxY=Math.max(maxY,n.y+n.h);});
svg.setAttribute('width',maxX+80);svg.setAttribute('height',maxY+80);
board.style.width=(maxX+80)+'px';board.style.height=(maxY+120)+'px';
EDGES.forEach(e=>{
 const[a,fa,b,ta,label,yn,dash]=e;const A=NM[a],B=NM[b];
 const[sx,sy]=anchor(A,fa),[ex,ey]=anchor(B,ta);
 let dpath,mx,my;
 if(fa==='b'||fa==='t'){const midY=(sy+ey)/2;dpath=`M ${sx} ${sy} L ${sx} ${midY} L ${ex} ${midY} L ${ex} ${ey}`;mx=(sx+ex)/2;my=midY;}
 else{const midX=(sx+ex)/2;dpath=`M ${sx} ${sy} L ${midX} ${sy} L ${midX} ${ey} L ${ex} ${ey}`;mx=midX;my=(sy+ey)/2;}
 const p=document.createElementNS(NS,'path');p.setAttribute('d',dpath);
 p.setAttribute('fill','none');p.setAttribute('stroke',dash?'#9bb0c2':'#5b7186');
 p.setAttribute('stroke-width',dash?'1.6':'2');if(dash)p.setAttribute('stroke-dasharray','5 4');
 p.setAttribute('marker-end','url(#ah)');svg.appendChild(p);
 if(label){const l=document.createElement('div');l.className='elabel'+(yn?' '+yn:'');l.textContent=label;l.style.left=mx+'px';l.style.top=my+'px';board.appendChild(l);}
});
// pan & zoom
let tx=40,ty=20,sc=0.82;const vp=document.getElementById('viewport');
function apply(){board.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;}
apply();
let pan=false,px,py;
vp.addEventListener('mousedown',e=>{if(e.target.closest('.node.phase'))return;pan=true;px=e.clientX;py=e.clientY;vp.classList.add('grab');});
window.addEventListener('mousemove',e=>{if(!pan)return;tx+=e.clientX-px;ty+=e.clientY-py;px=e.clientX;py=e.clientY;apply();});
window.addEventListener('mouseup',()=>{pan=false;vp.classList.remove('grab');});
vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;const f=e.deltaY<0?1.12:1/1.12;const ns=Math.min(2.2,Math.max(0.3,sc*f));tx=mx-(mx-tx)*(ns/sc);ty=my-(my-ty)*(ns/sc);sc=ns;apply();},{passive:false});
function zoom(f){const r=vp.getBoundingClientRect();const mx=r.width/2,my=r.height/2;const ns=Math.min(2.2,Math.max(0.3,sc*f));tx=mx-(mx-tx)*(ns/sc);ty=my-(my-ty)*(ns/sc);sc=ns;apply();}
function fit(){const r=vp.getBoundingClientRect();const bw=maxX+80,bh=maxY+120;sc=Math.min(r.width/bw,r.height/bh)*0.96;tx=(r.width-bw*sc)/2;ty=10;apply();}
setTimeout(fit,60);window.addEventListener('resize',fit);
// drawer
function openDrawer(s){
 const st=STAGES[s],role=ROLES[st.role];
 const io=(t,arr,cls)=>arr&&arr.length?`<div class="box ${cls||''}"><h4>${t}</h4><ul>${arr.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'';
 const decs=st.decisions?st.decisions.map(d=>`<div class="dec2"><h4>Решение</h4><div style="font-weight:600;margin-bottom:5px">${d.q}</div><div class="branch"><span class="yn y">ДА</span><div>${d.y}</div></div><div class="branch"><span class="yn n">НЕТ</span><div>${d.n}</div></div></div>`).join(''):'';
 const afn=st.afn?`<div class="afn"><h4>Петля устранения (АФН)</h4><div class="row"><div class="stp">Выявлено нарушение</div><span class="ar">→</span><div class="stp">АФН (Прил.7): 3 подписи, фото</div><span class="ar">→</span><div class="stp">Журнал АФН (Прил.9), срок</div><span class="ar">→</span><div class="stp d">Устранено?</div></div><div class="row" style="margin-top:8px"><span class="yn y">ДА</span><div class="stp">Отметка «устранено», статус закрыт</div><span class="yn n" style="margin-left:8px">НЕТ</span><div class="stp e">Письмо (Прил.10) → Правовая служба (Прил.11) → претензия</div></div></div>`:'';
 const meta=[];if(st.term)meta.push(`<span class="pill term">⏱ ${st.term}</span>`);(st.norms||[]).forEach(n=>meta.push(`<span class="pill norm">${n}</span>`));
 const apps=(st.apps||[]).map(a=>`<span class="app" title="${APPS[a]}">Прил. ${a}</span>`).join('');
 document.getElementById('drawerInner').innerHTML=`<div class="dh"><span class="x" onclick="closeDrawer()">✕</span><div class="num">Фаза ${s}</div><h2>${st.t}</h2><span class="role" style="background:${role.c}">${role.n}</span></div><div class="dc">${io('Вход',st.inputs,'io')}${io('Действия',st.actions)}${decs}${afn}${io('Выход / документы',st.outputs,'io')}${apps?`<div class="box"><h4>Приложения</h4>${apps}</div>`:''}${meta.length?`<div class="box"><h4>Сроки и нормы</h4><div class="meta">${meta.join('')}</div></div>`:''}</div>`;
 document.getElementById('drawer').classList.add('on');document.getElementById('scrim').classList.add('on');
}
function closeDrawer(){document.getElementById('drawer').classList.remove('on');document.getElementById('scrim').classList.remove('on');}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
</script></body></html>
